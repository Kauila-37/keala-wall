# Netlify config — static site, no build step.
# Publishes the repo root as-is. Kept in version control so the deploy
# setup is reproducible and travels with the repo.

[build]
  publish = "."

# Keep non-production deploys (staging branch + PR deploy previews) out of
# search engines so they never compete with the live domain as duplicate
# content. Production (main) gets no _headers file, so it stays crawlable.
[context.branch-deploy]
  command = "printf '/*\\n  X-Robots-Tag: noindex\\n' > _headers"

[context.deploy-preview]
  command = "printf '/*\\n  X-Robots-Tag: noindex\\n' > _headers"

# ─── Retired pages ──────────────────────────────────────────────────
# 2026-07-24: the site was restructured onto the brand's three pillars.
# Six content pages became three, and the deep-dives that used to have
# their own URLs are now anchored sections of the pillar page that
# absorbed them. Each old URL points at the exact section that replaced
# it, so nothing 404s and no one lands at the top of a very long page
# wondering where their content went.

[[redirects]]
  from = "/relocation.html"
  to = "/life"
  status = 301

[[redirects]]
  from = "/areas.html"
  to = "/life#districts"
  status = 301

[[redirects]]
  from = "/ranches.html"
  to = "/land#ranches"
  status = 301

[[redirects]]
  from = "/off-grid.html"
  to = "/land#off-grid"
  status = 301

# The two prose "guides" were duplicates of the free land/relocation pages
# and were removed 2026-07-23; send any bookmarked links to the real pages.
[[redirects]]
  from = "/guide-land-buying.html"
  to = "/land"
  status = 301

[[redirects]]
  from = "/guide-relocation.html"
  to = "/life"
  status = 301

# ─── Extensionless URLs ─────────────────────────────────────────────
# Netlify already serves life.html at /life. These send the .html form to
# the clean one, so no page has two indexable addresses.

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/life.html"
  to = "/life"
  status = 301

[[redirects]]
  from = "/land.html"
  to = "/land"
  status = 301

[[redirects]]
  from = "/legacy.html"
  to = "/legacy"
  status = 301

[[redirects]]
  from = "/listings.html"
  to = "/listings"
  status = 301

[[redirects]]
  from = "/guides.html"
  to = "/guides"
  status = 301

[[redirects]]
  from = "/checklist-land-due-diligence.html"
  to = "/checklist-land-due-diligence"
  status = 301

# ─── Area fact sheets ───────────────────────────────────────────────
# 2026-07-24: fact-sheet slugs realigned to the island's nine judicial
# districts (Kailua-Kona → north-kona, Hilo → south-hilo, Waimea →
# south-kohala). Old clean URLs and .html forms 301 to the new slug so
# prior links, bookmarks, and indexed pages never 404. Puna was already
# a judicial district and is unchanged.

# Kailua-Kona → North Kona
[[redirects]]
  from = "/factsheet-kona"
  to = "/factsheet-north-kona"
  status = 301
[[redirects]]
  from = "/factsheet-kona.html"
  to = "/factsheet-north-kona"
  status = 301
[[redirects]]
  from = "/factsheet-north-kona.html"
  to = "/factsheet-north-kona"
  status = 301

# Hilo → South Hilo
[[redirects]]
  from = "/factsheet-hilo"
  to = "/factsheet-south-hilo"
  status = 301
[[redirects]]
  from = "/factsheet-hilo.html"
  to = "/factsheet-south-hilo"
  status = 301
[[redirects]]
  from = "/factsheet-south-hilo.html"
  to = "/factsheet-south-hilo"
  status = 301

# Waimea / Kamuela → South Kohala
[[redirects]]
  from = "/factsheet-waimea"
  to = "/factsheet-south-kohala"
  status = 301
[[redirects]]
  from = "/factsheet-waimea.html"
  to = "/factsheet-south-kohala"
  status = 301
[[redirects]]
  from = "/factsheet-south-kohala.html"
  to = "/factsheet-south-kohala"
  status = 301

# Puna (unchanged — already a judicial district)
[[redirects]]
  from = "/factsheet-puna.html"
  to = "/factsheet-puna"
  status = 301
